<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Naviq – Klarer Bedarf. Passende Kontakte.</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:#15213a;
  background:#f6f8fc;
  line-height:1.6;
}

.wrap{
  width:min(1120px,calc(100% - 40px));
  margin:auto;
}

.preview{
  background:#fff1ce;
  color:#73500a;
  text-align:center;
  padding:10px 15px;
  font-size:13px;
  font-weight:700;
}

header{
  background:#0b1326;
  color:white;
}

nav{
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  color:white;
  text-decoration:none;
  font-weight:850;
  font-size:30px;
  letter-spacing:-2px;
}

.logo span{
  color:#a6efd8;
}

.navlinks{
  display:flex;
  align-items:center;
  gap:22px;
}

.navlinks a{
  text-decoration:none;
  color:#d3ddec;
  font-size:14px;
}

.navlinks .button{
  border:1px solid #53627c;
  padding:10px 16px;
  border-radius:999px;
}

.hero{
  background:#0b1326;
  color:white;
  padding:90px 0 110px;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:55px;
  align-items:center;
}

.eyebrow{
  color:#a6efd8;
  text-transform:uppercase;
  letter-spacing:2px;
  font-size:12px;
  font-weight:800;
}

h1{
  font-size:clamp(46px,7vw,76px);
  line-height:1.02;
  letter-spacing:-4px;
  margin:18px 0;
}

h1 span{
  color:#a6efd8;
}

.hero p{
  color:#c0cde1;
  font-size:18px;
  max-width:620px;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:30px;
}

.btn{
  display:inline-block;
  text-decoration:none;
  padding:15px 21px;
  border-radius:12px;
  font-weight:750;
}

.btn-primary{
  background:#b8f5df;
  color:#082c26;
}

.btn-secondary{
  color:white;
  border:1px solid #526079;
}

.card{
  background:#ffffff0d;
  border:1px solid #ffffff2c;
  border-radius:25px;
  padding:32px;
  box-shadow:0 30px 70px #0004;
}

.card-label{
  color:#a6efd8;
  font-size:12px;
  font-weight:800;
  letter-spacing:1px;
}

.card h3{
  font-size:28px;
  line-height:1.2;
}

.card-line{
  height:10px;
  background:#ffffff25;
  border-radius:20px;
  margin:15px 0;
}

.card-line.short{
  width:65%;
}

.trust{
  margin-top:-38px;
  position:relative;
}

.trust-box{
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 15px 45px #18294815;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  font-weight:700;
}

section{
  padding:90px 0;
}

.kicker{
  color:#2766dd;
  font-size:12px;
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:2px;
}

h2{
  font-size:clamp(32px,5vw,48px);
  line-height:1.15;
  letter-spacing:-2px;
  margin:12px 0 18px;
}

.lead{
  color:#617089;
  max-width:760px;
  font-size:17px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  margin-top:40px;
}

.service{
  background:white;
  border:1px solid #e4e9f2;
  border-radius:20px;
  padding:28px;
}

.service .icon{
  width:50px;
  height:50px;
  border-radius:14px;
  background:#edf3ff;
  display:grid;
  place-items:center;
  font-size:23px;
}

.service h3{
  margin:20px 0 8px;
  font-size:20px;
}

.service p{
  color:#617089;
  margin:0;
}

.alt{
  background:white;
}

.steps{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
  margin-top:40px;
}

.step{
  border-top:2px solid #d9e3f3;
  padding-top:20px;
}

.number{
  color:#3976ef;
  font-weight:800;
}

.founder{
  display:grid;
  grid-template-columns:160px 1fr;
  gap:30px;
  align-items:center;
  background:white;
  border:1px solid #e4e9f2;
  padding:28px;
  border-radius:24px;
  margin-top:35px;
}

.avatar{
  width:150px;
  height:180px;
  border-radius:16px;
  background:linear-gradient(145deg,#142341,#3876ff);
  color:white;
  display:grid;
  place-items:center;
  font-size:42px;
  font-weight:800;
}

.contact{
  background:#0b1326;
  color:white;
}

.contact .lead{
  color:#becbe0;
}

.contact-box{
  margin-top:35px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}

.contact-card{
  background:#ffffff0d;
  border:1px solid #ffffff25;
  border-radius:18px;
  padding:25px;
}

.contact-card a{
  color:#a6efd8;
}

.faq details{
  background:white;
  border:1px solid #e4e9f2;
  border-radius:13px;
  padding:18px 21px;
  margin-top:12px;
}

.faq summary{
  font-weight:750;
  cursor:pointer;
}

.faq p{
  color:#617089;
}

footer{
  background:#080f1f;
  color:#aab8cf;
  padding:35px 0;
  font-size:13px;
}

footer a{
  color:#d6e0f1;
}

.footerlinks{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  margin-top:12px;
}

@media(max-width:750px){
  .navlinks a:not(.button){
    display:none;
  }

  .hero-grid,
  .grid,
  .steps,
  .contact-box,
  .founder,
  .trust-box{
    grid-template-columns:1fr;
  }

  .hero{
    padding-top:65px;
  }

  h1{
    letter-spacing:-2.5px;
  }

  .avatar{
    width:115px;
    height:140px;
    font-size:32px;
  }
}
</style>
</head>

<body>

<div class="preview">
  Naviq befindet sich aktuell im Aufbau.
</div>

<header>
  <div class="wrap">
    <nav>
